name = "videodownloadershortcut"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 非敏感的环境变量
[vars]
# 公开 API 的 Base URL（生成代理下载链接用），例如 https://your-worker.example.com
PUBLIC_BASE_URL = "http://localhost:8787"

# 敏感配置不要写入 wrangler.toml：
# npx wrangler secret put DOUYIN_COOKIE
# npx wrangler secret put PUBLIC_API_KEY

# 如果要代理下载流量（视频流经 Worker），取消下面注释
# 注意：会产生大量出口流量，按需开启
# [[rules]]
#   type = "ESModule"
#   globs = ["**/*.ts"]

# 日志
[observability]
enabled = true
